name: sync-upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.repository.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT || github.token }}

      - name: Merge upstream dev into the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch --no-tags upstream dev
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff --no-commit FETCH_HEAD
          git -c core.hooksPath=/dev/null commit -m "chore: merge upstream dev"
          git -c core.hooksPath=/dev/null push origin "HEAD:$DEFAULT_BRANCH"
